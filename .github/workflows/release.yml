name: release

# Solo compila y publica. vet, tests, cobertura y e2e se verifican en local
# (scripts/gate.ps1 -Full, scripts/strict.ps1) antes de poner el tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build dashboard (web/dist para go:embed)
        run: pnpm install --frozen-lockfile; pnpm --dir web build
        shell: pwsh

      - name: Build windows/amd64
        run: go build -trimpath -ldflags "-s -w -X rkt/internal/build.Version=${{ github.ref_name }}" -o rkt-windows-amd64.exe ./cmd/rkt
        shell: pwsh

      - name: Smoke (reporta la versión del tag)
        run: |
          $v = (./rkt-windows-amd64.exe version).Trim()
          if ($v -ne "${{ github.ref_name }}") { Write-Error "version=$v, esperaba ${{ github.ref_name }}"; exit 1 }
        shell: pwsh

      - name: Checksum
        run: ((Get-FileHash rkt-windows-amd64.exe -Algorithm SHA256).Hash + "  rkt-windows-amd64.exe") | Out-File checksums.txt -Encoding ascii
        shell: pwsh

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rkt-windows-amd64.exe
            checksums.txt
          generate_release_notes: true
          # v0.7.0-beta.1 => prerelease; v0.7.0 => latest estable.
          prerelease: ${{ contains(github.ref_name, '-') }}
