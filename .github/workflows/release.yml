name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build dashboard (web/dist para go:embed)
        run: pnpm --dir web install --frozen-lockfile; pnpm --dir web build
        shell: pwsh

      - run: go vet ./...
        shell: pwsh

      - run: go test ./...
        shell: pwsh

      - name: Build windows/amd64
        run: go build -trimpath -ldflags "-s -w -X rkt-proxy/internal/build.Version=${{ github.ref_name }}" -o rkt-windows-amd64.exe ./cmd/rkt-proxy
        shell: pwsh

      - name: Checksum
        run: ((Get-FileHash rkt-windows-amd64.exe -Algorithm SHA256).Hash + "  rkt-windows-amd64.exe") | Out-File checksums.txt -Encoding ascii
        shell: pwsh

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rkt-windows-amd64.exe
            checksums.txt
          generate_release_notes: true
