name: ci

# Política: NADA corre automáticamente aquí. Todo lo que se puede comprobar en
# local se comprueba en local antes del push (hook .githooks/pre-push ->
# scripts/prepush.ps1: gate -Full + cleanroom; al publicar un tag v*,
# scripts/strict.ps1 completo con race, e2e y gates prod).
#
# Este workflow queda solo como segunda opinión a mano en una máquina limpia:
# Actions -> ci -> Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: gcc (race detector)
        # La imagen puede traer mingw; solo se instala si falta.
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw --no-progress -y
          }
        shell: pwsh

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-0.6401.0-${{ runner.os }}

      - name: Gate estricto
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/strict.ps1
        shell: pwsh

      - name: Subir strict.log si falla (diagnóstico de cobertura)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: strict-log
          path: strict.log
