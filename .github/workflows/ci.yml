name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Instalar y compilar dashboard (go:embed)
        run: pnpm --dir web install --frozen-lockfile; pnpm --dir web build
        shell: pwsh

      - name: Tipos del dashboard
        run: pnpm --dir web exec tsc --noEmit
        shell: pwsh

      - name: Formato Go
        run: |
          $out = gofmt -l .
          if ($out) { Write-Error "gofmt pendiente:`n$out"; exit 1 }
        shell: pwsh

      - name: Vet
        run: go vet ./...
        shell: pwsh

      - name: Tests (sin cache)
        run: go test ./... -count=1
        shell: pwsh

      - name: Build
        run: go build -trimpath -o bin/rkt.exe ./cmd/rkt-proxy
        shell: pwsh
